<!DOCTYPE html><html lang="ar" dir="rtl"><head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>المساعد التسويقي الذكي | Smart Digital Marketing</title>  <link rel="stylesheet" href="style.css">
</head><body>  <div class="chat-container"><!-- رأس المحادثة -->
<header class="chat-header">

  <div class="bot-avatar">
    🤖
  </div>

  <div class="header-text">
    <h2>المساعد التسويقي الذكي</h2>
    <span>Smart Digital Marketing</span>
  </div>

  <div class="online-status">
    <span></span>
    متصل
  </div>

</header>


<!-- معلومات الشركة -->
<div class="settings-bar">

  <div class="field">
    <label for="company">الشركة</label>

    <select id="company">
      <option value="DXN">DXN</option>
    </select>
  </div>

  <div class="field">
    <label for="section">القسم</label>

    <select id="section">

      <option value="عام">
        عام
      </option>

      <option value="المنتجات">
        المنتجات
      </option>

      <option value="فرصة العمل">
        فرصة العمل
      </option>

      <option value="العضوية والتسجيل">
        العضوية والتسجيل
      </option>

    </select>
  </div>

</div>


<!-- منطقة المحادثة -->
<main id="chatMessages" class="chat-messages">

  <div class="message bot-message">

    <div class="message-avatar">
      🤖
    </div>

    <div class="message-content">

      <div class="message-name">
        المساعد التسويقي
      </div>

      <div class="message-bubble">
        مرحباً بك 👋<br><br>
        أنا المساعد التسويقي الذكي الخاص بموقع
        <strong>Smart Digital Marketing</strong>.
        <br><br>
        يمكنك سؤالي عن شركة DXN أو المنتجات أو العضوية والتسجيل أو فرصة العمل.
      </div>

    </div>

  </div>

</main>


<!-- منطقة الكتابة -->
<div class="input-area">

  <div class="input-wrapper">

    <input
      id="question"
      type="text"
      autocomplete="off"
      placeholder="اكتب رسالتك هنا..."
    >

    <button
      id="sendButton"
      type="button"
      aria-label="إرسال"
    >
      ➤
    </button>

  </div>

  <div class="input-hint">
    اضغط Enter لإرسال الرسالة
  </div>

</div>


<!-- معلومات التواصل -->
<div class="contact-bar">

  <div>
    <strong>رمز الراعي:</strong>
    829134401
  </div>

  <a
    href="https://eworld.dxn2u.com/s/accreg/ar/829134401"
    target="_blank"
    rel="noopener"
  >
    التسجيل
  </a>

  <a
    href="https://wa.me/218946098624"
    target="_blank"
    rel="noopener"
  >
    واتساب
  </a>

</div>
